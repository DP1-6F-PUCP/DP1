server.port=8080
spring.application.name=paqrap-backend

# Apagado ordenado: termina las peticiones en curso y da tiempo a ApagadoOrdenado para cerrar la
# ejecución activa y guardar su reporte (Docker debe esperar más que esto: stop_grace_period).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL (compatible con .env.example y docker-compose.yml)
# DB_PASSWORD no tiene valor por defecto: hay que definirla (variable de entorno) o arrancar con el
# perfil "dev" (SPRING_PROFILES_ACTIVE=dev), que trae la clave local de desarrollo.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sysmile_db}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:sysmile_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
