server.port=8080
spring.application.name=paqrap-backend

# PostgreSQL (compatible con .env.example y docker-compose.yml)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sysmile_db}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USER:sysmile_user}
spring.datasource.password=${DB_PASSWORD:sysmile_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
