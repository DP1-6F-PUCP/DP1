services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sysmile_db}
      POSTGRES_USER: ${DB_USER:-sysmile_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sysmile_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sysmile_user} -d ${DB_NAME:-sysmile_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/dp1-6f-pucp/dp1-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sysmile_db}
      DB_USER: ${DB_USER:-sysmile_user}
      DB_PASSWORD: ${DB_PASSWORD:-sysmile_password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/dp1-6f-pucp/dp1-frontend:latest
    build:
      context: ./frontend
      network: host
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-60}
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval ${WATCHTOWER_INTERVAL:-60} --cleanup backend frontend
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle_data:/data
    environment:
      - DOZZLE_BASE=${DOZZLE_BASE:-/}

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dozzle_data:
  postgres_data:
