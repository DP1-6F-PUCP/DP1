services:
  # No hay servicio de base de datos: todo el dominio (ContextoProblema, OrquestadorOperacion,
  # etc.) vive en memoria por ejecucion de escenario -- backend/pom.xml no tiene ni el starter de
  # JPA ni el driver de Postgres, asi que un "db" aqui seria infraestructura muerta (y, peor,
  # bloquearia el arranque de "backend" esperando un healthcheck de algo que nadie usa).
  backend:
    image: ghcr.io/dp1-6f-pucp/dp1-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      network: host
    container_name: backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dp1-6f-pucp/dp1-frontend:latest
    build:
      context: ./frontend
      network: host
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_PATH:-/root/.docker/config.json}:/config.json:ro
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=${WATCHTOWER_INTERVAL:-60}
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: --interval ${WATCHTOWER_INTERVAL:-60} --cleanup backend frontend
