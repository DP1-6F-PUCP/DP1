server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST: todo bajo /api/* lo expone SimulacionController/ConsultaController/AlertasController/
    # IngestaController en el contenedor "backend" (ver docker-compose.yml) -- sin este proxy,
    # httpClient.ts pedia "/api/..." al propio nginx (que solo sirve estaticos) y todo devolvia 404.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket: /ws/simulation (SimulationWebSocketHandler), server-push-only. Necesita el
    # upgrade de conexion explicito; sin "Upgrade"/"Connection" el proxy lo trataria como HTTP
    # normal y el handshake fallaria.
    #
    # Bug real corregido: proxy_read_timeout por defecto es 60s -- como OrquestadorOperacion solo
    # empuja un tick cada "sa" minutos reales (5 min por defecto, puede ser mayor), nginx mataba la
    # conexion por inactividad mucho antes de que llegara el primer mensaje, en bucle infinito de
    # reconexion (confirmado en los logs: "Sesion WebSocket conectada/cerrada" cada ~60s). El
    # cliente se reconectaba solo (simulationSocket.ts ya tiene ese fallback), asi que nunca se via
    # como un error, pero significaba que el push en vivo nunca llegaba a sobrevivir lo suficiente
    # para recibir un tick real -- el usuario dependia enteramente del polling de 3s de refetch.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Assets con hash de contenido en el nombre (dist/assets/index-XXXX.js) -- un rebuild produce
    # un nombre de archivo nuevo, asi que cachearlos agresivamente es seguro: la URL cambia sola
    # cuando el contenido cambia.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier ruta que no sea /api o /ws cae al index.html de React Router.
    #
    # Bug real corregido: sin esto, nginx no mandaba ningun header de cache para index.html, y el
    # navegador podia (heuristicamente, via Last-Modified) seguir sirviendo el index.html VIEJO de
    # cache propia -- que apunta a los nombres de archivo hasheados de un build anterior. Resultado:
    # por mas veces que se reconstruya y redespliegue el contenedor, el navegador seguia ejecutando
    # JS de hace varios rebuilds sin ningun error visible, indistinguible de "el fix no sirvio".
    # index.html en cambio SI debe revalidarse siempre: es la unica pieza sin hash en el nombre.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
